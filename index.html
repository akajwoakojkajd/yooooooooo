```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🤓🫵🏼 YOU</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: #f2f2f2;
  color: #111;
  text-align: center;
  overflow-x: hidden;
  transition: 0.2s;
}

body.shake {
  animation: shake 0.35s;
}

@keyframes shake {
  0% { transform: translate(0); }
  20% { transform: translate(-8px, 5px); }
  40% { transform: translate(8px, -5px); }
  60% { transform: translate(-5px, -3px); }
  80% { transform: translate(5px, 4px); }
  100% { transform: translate(0); }
}

header {
  background: #111;
  color: white;
  padding: 35px 20px;
  border-bottom: 6px solid #ddd;
}

header h1 {
  margin: 0;
  font-size: 42px;
}

header p {
  color: #ccc;
}

.container {
  max-width: 950px;
  margin: auto;
  padding: 20px;
}

.warning {
  background: white;
  border: 3px solid #111;
  padding: 18px;
  margin: 10px auto 30px;
  max-width: 700px;
  font-weight: bold;
  box-shadow: 6px 6px 0 #111;
}

.emoji-wall {
  font-size: 30px;
  line-height: 1.6;
  padding: 20px;
  word-break: break-word;
}

.games {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 18px;
}

button {
  border: 3px solid #111;
  background: white;
  padding: 22px 12px;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 5px 5px 0 #111;
  transition: 0.12s;
  position: relative;
}

button:hover {
  transform: translate(3px, 3px) rotate(-1deg);
  box-shadow: 2px 2px 0 #111;
  background: #eee;
}

button:active {
  transform: translate(5px, 5px);
  box-shadow: none;
}

.emoji {
  display: block;
  font-size: 42px;
  margin-bottom: 8px;
}

#result {
  min-height: 140px;
  margin: 40px auto;
  max-width: 750px;
  background: #111;
  color: white;
  padding: 30px 20px;
  font-size: 24px;
  font-weight: bold;
  display: flex;
  justify-content: center;
  align-items: center;
  border: 4px solid #111;
}

.big {
  font-size: 80px;
  margin: 20px 0;
  animation: spin 1s ease infinite alternate;
}

@keyframes spin {
  from {
    transform: rotate(-8deg) scale(0.9);
  }
  to {
    transform: rotate(8deg) scale(1.05);
  }
}

.counter {
  margin: 20px;
  font-size: 18px;
  font-weight: bold;
}

footer {
  margin-top: 50px;
  padding: 30px;
  background: #111;
  color: white;
}

/* Flying emojis */

.flying {
  position: fixed;
  pointer-events: none;
  font-size: 35px;
  z-index: 9999;
  animation: fly 1.5s linear forwards;
}

@keyframes fly {
  0% {
    transform: translateY(0) rotate(0deg);
    opacity: 1;
  }

  100% {
    transform: translateY(-500px) rotate(720deg);
    opacity: 0;
  }
}

/* Fake loading */

.loading {
  width: 80%;
  height: 20px;
  border: 3px solid white;
  margin: 20px auto;
}

.loading-bar {
  height: 100%;
  width: 0%;
  background: white;
  animation: load 2s forwards;
}

@keyframes load {
  0% { width: 0%; }
  100% { width: 100%; }
}

/* Runaway button */

#runaway {
  position: relative;
}

@media (max-width: 500px) {
  header h1 {
    font-size: 30px;
  }

  .games {
    grid-template-columns: 1fr 1fr;
  }

  button {
    font-size: 14px;
  }
}
</style>
</head>

<script>

function countClick() {

function show(message) {

function runAway() {

  const x = Math.random() * 250 - 125;
  const y = Math.random() * 150 - 75;

}

function shake() {

  document.body.classList.remove("shake");

  void document.body.offsetWidth;

  document.body.classList.add("shake");
}

function spawnEmoji() {

  const emoji = document.createElement("div");

  emoji.className = "flying";

  const emojis = [
    "🤓",
    "🫵🏼",
    "📦",
    "💀",
    "🧠",
    "🛒"
  ];

  emoji.textContent =
    emojis[Math.floor(Math.random() * emojis.length)];

  emoji.style.left =
    Math.random() * 100 + "vw";

  emoji.style.bottom = "0px";

  document.body.appendChild(emoji);

  setTimeout(() => {
    emoji.remove();
  }, 1500);
}

function spawnMany() {

  for (let i = 0; i < 15; i++) {
    setTimeout(spawnEmoji, i * 100);
  }
}
